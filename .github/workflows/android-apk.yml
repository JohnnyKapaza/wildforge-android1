name: Build Wildforge APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble Android source
        run: cat bundle/part-* | base64 -d > apk-source.zip && unzip -q apk-source.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          npm install --no-save @capacitor/android@8 @capacitor/core@8
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Wildforge-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
