name: Inspect Wildforge v0.6 source
on:
  push:
    branches: ["codex/v0.6"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble Android source
        run: cat bundle-v5/part-* | base64 -d > apk-source.zip && unzip -q apk-source.zip
      - name: Emit source snapshot
        shell: bash
        run: |
          files=(
            android/app/src/main/assets/public/index.html
            android/app/src/main/assets/public/game.js
            android/app/src/main/assets/public/style.css
            android/app/src/main/assets/public/combat.css
            android/app/src/main/assets/public/sw.js
            android/app/build.gradle
          )
          for file in "${files[@]}"; do
            echo "WILDFORGE_FILE_BEGIN:${file}"
            base64 -w0 "${file}"
            echo
            echo "WILDFORGE_FILE_END:${file}"
          done
